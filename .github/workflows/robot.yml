name: Robot de noticias (cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: robot-milagros
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar noticias de milagros
        run: node scripts/robot.mjs
      - name: Guardar si hay novedades
        run: |
          if git diff --quiet -- data/noticias.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "robot-milagros"
          git config user.email "robot-milagros@users.noreply.github.com"
          git add data/noticias.json
          git commit -m "Robot: noticias de milagros $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
